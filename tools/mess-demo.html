<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mess-up looks</title>
<style>
  body{margin:0;padding:32px;background:#0b1d31;color:#f4f7fb;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  h1{margin:0 0 6px;font-size:26px}
  p.lede{margin:0 0 24px;color:#c6d3e3}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:24px}
  figure{margin:0}
  canvas{display:block;width:100%;aspect-ratio:16/10;border-radius:18px}
  figcaption{margin-top:10px}
  figcaption b{display:block;font-size:18px}
  figcaption span{color:#c6d3e3}
</style>
</head>
<body>
<h1>Mess-up looks</h1>
<p class="lede">The same wavy rub on each. Pick the one that says "I just wrecked his floor" at a glance.</p>
<div class="grid" id="grid"></div>
<script>
var VARIANTS=[
  ['A','Now: blurred concrete','For reference. Reads as a smudge or a rendering glitch.'],
  ['B','Chipped coating','The epoxy is torn off down to raw concrete: a crisp, ragged edge with a lit lip, and loose flakes scattered around.'],
  ['C','Gouged scratches','Bright scratches cut through the gloss, like dragging keys or a toolbox across it.'],
  ['D','Muddy boot smear','A dirty brown smear with streaks and clumps. Instantly "you made a mess".'],
  ['E','Oil spill','A dark, glossy puddle with a rainbow sheen at the edge.']
];
var IW=1536,IH=1024,W=1280,H=800;
var g=new Image(),b=new Image(),n=0;g.src='../img/garage.webp';b.src='../img/garage-bare.webp';g.onload=b.onload=function(){if(++n===2)VARIANTS.forEach(build)};
function cover(ctx,img){var s=Math.max(W/IW,H/IH),dw=IW*s,dh=IH*s;ctx.drawImage(img,(W-dw)/2,(H-dh)*.6,dw,dh)}
var rnd=(function(seed){return function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}})(7);
function path(){var p=[];for(var x=W*.12;x<=W*.66;x+=6)p.push([x,H*.8+34*Math.sin(x/58)+10*Math.sin(x/17)]);return p}
function stroke(ctx,p,w){ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=w;ctx.beginPath();p.forEach(function(q,i){ctx[i?'lineTo':'moveTo'](q[0],q[1])});ctx.stroke()}
function normals(p){return p.map(function(q,i){var a=p[Math.max(0,i-1)],c=p[Math.min(p.length-1,i+1)],dx=c[0]-a[0],dy=c[1]-a[1],l=Math.hypot(dx,dy)||1;return [-dy/l,dx/l]})}
function ragged(p,w){var nm=normals(p),top=[],bot=[];p.forEach(function(q,i){var j1=w/2*(.75+rnd()*.5),j2=w/2*(.75+rnd()*.5);top.push([q[0]+nm[i][0]*j1,q[1]+nm[i][1]*j1]);bot.push([q[0]-nm[i][0]*j2,q[1]-nm[i][1]*j2])});
  var cap=[];for(var t=0;t<=8;t++){var a=Math.PI*t/8,e=p[p.length-1];cap.push([e[0]+Math.cos(a-Math.PI/2)*w/2*(.8+rnd()*.4),e[1]+Math.sin(a-Math.PI/2)*w/2*(.8+rnd()*.4)])}
  return top.concat(cap,bot.reverse())}
function poly(ctx,pts){ctx.beginPath();pts.forEach(function(q,i){ctx[i?'lineTo':'moveTo'](q[0],q[1])});ctx.closePath()}

var DRAW={
  A:function(ctx,p){var m=document.createElement('canvas');m.width=W;m.height=H;var mc=m.getContext('2d');mc.strokeStyle='#000';stroke(mc,p,120);mc.globalCompositeOperation='source-in';cover(mc,b);ctx.drawImage(m,0,0)},
  B:function(ctx,p){
    var pts=ragged(p,70);
    ctx.save();poly(ctx,pts);ctx.clip();cover(ctx,b);
    // shadow under the torn lip on the far edge, inside the hole
    ctx.translate(0,5);ctx.strokeStyle='rgba(20,22,26,.55)';ctx.lineWidth=7;poly(ctx,pts);ctx.stroke();ctx.restore();
    ctx.strokeStyle='rgba(250,250,248,.75)';ctx.lineWidth=2.2;poly(ctx,pts);ctx.stroke();
    ctx.strokeStyle='rgba(30,32,36,.35)';ctx.lineWidth=1;ctx.save();ctx.translate(0,2);poly(ctx,pts);ctx.stroke();ctx.restore();
    for(var i=0;i<70;i++){var q=p[(rnd()*p.length)|0],r=40+rnd()*70,a=rnd()*6.3,x=q[0]+Math.cos(a)*r,y=q[1]+Math.sin(a)*r*.45,s=3+rnd()*7;
      ctx.fillStyle=['#e8e6e1','#9a9da2','#2a2c30','#c8cacd'][(rnd()*4)|0];ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s,y+s*.3);ctx.lineTo(x+s*.6,y+s*.8);ctx.lineTo(x-s*.2,y+s*.5);ctx.closePath();ctx.fill()}
  },
  C:function(ctx,p){
    for(var k=-4;k<=4;k++){var off=k*7+rnd()*3,nm=normals(p),q=p.map(function(v,i){return [v[0]+nm[i][0]*off,v[1]+nm[i][1]*off]}),st=(rnd()*q.length*.25)|0,en=q.length-((rnd()*q.length*.25)|0),seg=q.slice(st,en);
      ctx.strokeStyle='rgba(20,22,26,.5)';ctx.save();ctx.translate(0,1.6);stroke(ctx,seg,1.6);ctx.restore();
      ctx.strokeStyle='rgba(255,255,255,.85)';stroke(ctx,seg,1.4+rnd()*1.4)}
  },
  D:function(ctx,p){
    ctx.save();ctx.globalCompositeOperation='multiply';
    for(var i=0;i<p.length;i+=1){var q=p[i];for(var j=0;j<3;j++){ctx.fillStyle='rgba(118,84,52,'+(.18+rnd()*.2)+')';ctx.beginPath();ctx.ellipse(q[0]+(rnd()-.5)*40,q[1]+(rnd()-.5)*30,10+rnd()*26,6+rnd()*12,rnd()*.6-.3,0,6.3);ctx.fill()}}
    var nm=normals(p);for(var k=0;k<14;k++){var off=(rnd()-.5)*50;ctx.strokeStyle='rgba(80,54,30,'+(.25+rnd()*.3)+')';stroke(ctx,p.map(function(v,i){return [v[0]+nm[i][0]*off,v[1]+nm[i][1]*off]}).slice((rnd()*20)|0),1+rnd()*2.5)}
    for(var c=0;c<26;c++){var q2=p[(rnd()*p.length)|0];ctx.fillStyle='rgba(62,42,24,.75)';ctx.beginPath();ctx.ellipse(q2[0]+(rnd()-.5)*60,q2[1]+(rnd()-.5)*40,2+rnd()*5,1.5+rnd()*3,0,0,6.3);ctx.fill()}
    ctx.restore();
  },
  E:function(ctx,p){
    var nm=normals(p),top=[],bot=[];p.forEach(function(q,i){var r=24+22*Math.sin(i/5)+rnd()*10;top.push([q[0]+nm[i][0]*r,q[1]+nm[i][1]*r*.6]);bot.push([q[0]-nm[i][0]*r,q[1]-nm[i][1]*r*.6])});
    var pts=top.concat(bot.reverse());
    ctx.save();ctx.shadowColor='rgba(10,10,10,.5)';ctx.shadowBlur=14;ctx.fillStyle='rgba(22,19,16,.9)';poly(ctx,pts);ctx.fill();ctx.restore();
    var gr=ctx.createLinearGradient(p[0][0],0,p[p.length-1][0],0);['rgba(120,60,200,.45)','rgba(40,160,200,.45)','rgba(220,190,60,.45)','rgba(200,70,120,.45)'].forEach(function(c,i){gr.addColorStop(i/3,c)});
    ctx.strokeStyle=gr;ctx.lineWidth=5;poly(ctx,pts);ctx.stroke();
    ctx.save();poly(ctx,pts);ctx.clip();for(var i=0;i<5;i++){var q=p[(i+.5)*p.length/5|0],rg=ctx.createRadialGradient(q[0]-10,q[1]-6,0,q[0]-10,q[1]-6,40);rg.addColorStop(0,'rgba(255,255,255,.35)');rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.fillRect(q[0]-60,q[1]-50,120,100)}ctx.restore();
  }
};
function build(v){
  var f=document.createElement('figure'),c=document.createElement('canvas');c.width=W;c.height=H;
  var ctx=c.getContext('2d');cover(ctx,g);DRAW[v[0]](ctx,path());
  f.appendChild(c);var cap=document.createElement('figcaption');cap.innerHTML='<b>'+v[0]+'. '+v[1]+'</b><span>'+v[2]+'</span>';f.appendChild(cap);
  document.getElementById('grid').appendChild(f);
}
</script>
</body>
</html>
